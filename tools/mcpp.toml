[package]
namespace   = "mcpplibs"
name        = "openkal-tools"
version     = "0.5.2"
description = "okrun, which runs an ok image on this system, and okld, the format's tool on a build machine (check, note, sign, inspect)."
license     = "Apache-2.0"
authors     = ["mcpplibs"]
repo        = "https://github.com/mcpplibs/openkal-image"

[dependencies]
openkal-run = { path = "../run" }
openkal-ld  = { path = "../ld" }

# The compressor of `okld bundle --compress' (0.4): zlib's DEFLATE. The runner
# expands with libokld's own (freestanding) reader.
[dependencies.compat]
zlib = "1.3.2"

[targets.okrun]
kind = "bin"
main = "src/okrun.cpp"

[targets.okld]
kind = "bin"
main = "src/okld.cpp"

# What an image did across openkal, from the runner's reports (0.2).
[targets.okprof]
kind = "bin"
main = "src/okprof.cpp"

[build]
sources = []

# THE IMAGE'S MAIN THREAD IS THE RUNNER'S (0.5.2): an image is entered on okrun's
# main thread, whose stack on Windows is the executable's reservation, 1 MiB by
# the linker's default. openkal-windows gives every other thread at least 8 MiB
# (kal_task_start), and Linux and macOS give the main thread 8 MiB; an image's
# deep recursion on its main thread -- clangd.okb indexing the MSVC headers with
# `--sync` -- ended in STATUS_STACK_OVERFLOW. The reservation is a thread's
# default and openkal-windows' guard slack, 8 MiB + 256 KiB, spelled for each
# linker: lld-link on the MSVC ABI (a Windows host), the MinGW driver on the GNU
# ABI (the hosted arrangement, and a cross build).
[target.'cfg(all(windows, env = "msvc"))'.build]
ldflags = ["-Wl,/STACK:8650752"]

[target.'cfg(all(windows, env = "gnu"))'.build]
ldflags = ["-Wl,--stack,8650752"]
