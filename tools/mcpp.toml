[package]
namespace   = "mcpplibs"
name        = "openkal-tools"
version     = "0.4.3"
description = "okrun, which runs an ok image on this system, and okld, the format's tool on a build machine (check, note, sign, inspect)."
license     = "Apache-2.0"
authors     = ["mcpplibs"]
repo        = "https://github.com/mcpplibs/openkal-image"

[dependencies]
openkal-run = { path = "../run" }
openkal-ld  = { path = "../ld" }

# The compressor of `okld bundle --compress' (0.4): zlib's DEFLATE. The runner
# expands with libokld's own (freestanding) reader.
[dependencies.compat]
zlib = "1.3.2"

[targets.okrun]
kind = "bin"
main = "src/okrun.cpp"

[targets.okld]
kind = "bin"
main = "src/okld.cpp"

# What an image did across openkal, from the runner's reports (0.2).
[targets.okprof]
kind = "bin"
main = "src/okprof.cpp"

[build]
sources = []
