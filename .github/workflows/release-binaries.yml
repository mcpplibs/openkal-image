name: release binaries

# okrun and okld as programs of each system and architecture, attached to a
# release: what a machine without mcpp installs to run ok images (the
# xim-pkgindex `okrun` package). Dispatched with the release's tag; each archive
# is `mcpp pack` of the tool, a static program on Linux, and carries its
# mcpp-package.json, from which `mcpp emit xpkg --package` writes the index
# entry.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag the binaries are built from and attached to (e.g. 0.1.3)"
        required: true
      platform:
        description: "The openkal-platform whose hosted arrangement builds the tools: the one whose version group holds the implementations the tag pins (0.1.5: 0.19.0; 0.1.6: 0.19.1; 0.1.7: 0.19.2; 0.1.8: 0.20.0; 0.1.9: 0.20.1; 0.3.0: 0.21.0; 0.3.1: 0.21.1; 0.4.2: 0.23.1; 0.4.3 and 0.4.4: 0.23.3)"
        required: true
        default: "0.21.0"
      asset_revision:
        description: "Optional safe filename suffix for a corrective binary candidate; source tag/version stay unchanged"
        required: false
        default: ""
      mcpp_ref:
        description: "Branch of mcpp-community/mcpp to build with (empty = the released mcpp)"
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}
  ASSET_REVISION: ${{ github.event.inputs.asset_revision || '' }}
  MCPP_SOURCE_REF: ${{ github.event.inputs.mcpp_ref || vars.MCPP_SOURCE_REF || '' }}
  # 2026.11.9.1: openkal-run states its implementation as a capability with defaults.
  # mcpp_ref supplies the candidate until this release is installable.
  MCPP_VERSION: 2026.11.9.1
  # The platform whose hosted arrangement the programs are built over, named by
  # the dispatch beside the tag: a tag's tools pin exact implementations, and the
  # platform is the one whose version group holds them (0.1.4: 0.18.0; 0.1.5:
  # 0.19.0, openkal-linux 0.19.0; 0.1.6: 0.19.1; 0.1.7: 0.19.2; 0.1.8: 0.20.0; 0.1.9: 0.20.1;
  # 0.3.0: 0.21.0; 0.3.1: 0.21.1; 0.4.2: 0.23.1; 0.4.3 and 0.4.4: 0.23.3).
  PLATFORM_VERSION: ${{ github.event.inputs.platform }}
  XLINGS_VERSION: v2026.10.26.1
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  binaries:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each system's row over openkal-platform's hosted arrangement (mcpp
          # SPEC-013 §5.4), as mcpp builds the runner it carries in a
          # self-contained package: the platform's toolchain, C library and
          # C++ run-time over the system's openkal implementation -- static on
          # Linux, no SDK on macOS, no MSVC run-time on Windows.
          - { os: ubuntu-24.04,     id: linux-x86_64,   pack: '--target x86_64-linux-musl --mode static' }
          - { os: ubuntu-24.04-arm, id: linux-aarch64,  pack: '--target aarch64-linux-musl --mode static' }
          - { os: macos-15,         id: macos-aarch64,  pack: '--target aarch64-macos' }
          - { os: windows-2022,     id: windows-x86_64, pack: '--target x86_64-windows-gnu' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Install xlings and mcpp (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install xlings and mcpp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: The mcpp that packs
        run: |
          # A branch of mcpp is built by the latest released mcpp.
          want="mcpp@$MCPP_VERSION"
          [ -n "${MCPP_SOURCE_REF:-}" ] && want=mcpp
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "$want" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          mcpp self config --mirror GLOBAL
          if [ -n "${MCPP_SOURCE_REF:-}" ]; then
            src="$RUNNER_TEMP/mcpp-src"
            git clone --quiet --depth 1 --branch "$MCPP_SOURCE_REF" https://github.com/mcpp-community/mcpp.git "$src"
            rm -f "$src/.xlings.json"
            ( cd "$src" && MCPP_JOBS=2 mcpp build --release )
            built=$(find "$src/target" -type f \( -name mcpp -o -name mcpp.exe \) -path '*/bin/*' | head -1)
            [ -n "$built" ] || { echo "::error::mcpp did not build from $MCPP_SOURCE_REF"; exit 1; }
            echo "$(cd "$(dirname "$built")" && pwd)" >> "$GITHUB_PATH"
          fi

      - name: Validate new asset names before packing
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_ID: ${{ matrix.id }}
        run: |
          python=python3; [ "$RUNNER_OS" = Windows ] && python=python
          "$python" - <<'PY'
          import json, os, re, subprocess
          revision = os.environ['ASSET_REVISION']
          if revision and not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', revision):
              raise SystemExit('asset_revision must be a safe filename suffix')
          suffix = '-' + revision if revision else ''
          tag, system = os.environ['RELEASE_TAG'], os.environ['MATRIX_ID']
          names = {f'{tool}-{tag}{suffix}-{system}.zip' for tool in ('okrun', 'okld', 'okprof')}
          if system == 'linux-x86_64':
              names.add(f'openkal-debugger-scripts-{tag}{suffix}.zip')
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag,
              '--repo', os.environ['GITHUB_REPOSITORY'], '--json', 'assets'], text=True))
          if names.intersection(asset['name'] for asset in release['assets']):
              raise SystemExit('existing assets are immutable; choose a new asset_revision')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('ASSET_SUFFIX=' + suffix + '\n')
          PY

      - name: okrun, okld and okprof, packed
        working-directory: tools
        run: |
          tag="$RELEASE_TAG"
          mkdir -p ../out
          for tool in okrun okld okprof; do
            strip_args=()
            # A host debugger discovers the runner through its JIT symbols.
            if [ "$tool" = okrun ]; then strip_args=(--no-strip); fi
            mcpp pack "$tool" ${{ matrix.pack }} --platform "openkal-platform@$PLATFORM_VERSION" \
                "${strip_args[@]}" --pkg-format zip -o "$tool-$tag$ASSET_SUFFIX-${{ matrix.id }}.zip"
            cp "target/dist/$tool-$tag$ASSET_SUFFIX-${{ matrix.id }}.zip" ../out/
          done
          # The debugger's scripts (okgdb.py, oklldb.py) are the same on every
          # system: one archive, from one row.
          if [ '${{ matrix.id }}' = linux-x86_64 ]; then
            (cd scripts && zip -q -X "../../out/openkal-debugger-scripts-$tag$ASSET_SUFFIX.zip" okgdb.py oklldb.py okgdb_common.py)
          fi
          ls -l ../out

      - name: Each program runs here, from its package alone
        run: |
          python=python3; [ "$RUNNER_OS" = Windows ] && python=python
          tag="$RELEASE_TAG"
          for tool in okrun okld okprof; do
            root="$RUNNER_TEMP/x-$tool"
            # Unpacked as an unzip program does it, each file with the mode the
            # archive states (a program that lost its x bit fails here); the
            # program is the one the package's mcpp-package.json names.
            exe=$("$python" - "out/$tool-$tag$ASSET_SUFFIX-${{ matrix.id }}.zip" "$root" <<'PY'
          import json, os, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              for info in z.infolist():
                  path = z.extract(info, sys.argv[2])
                  mode = (info.external_attr >> 16) & 0o777
                  if mode:
                      os.chmod(path, mode)
              top = os.path.commonpath([n for n in z.namelist()]).split("/")[0]
          d = json.load(open(os.path.join(sys.argv[2], top, "mcpp-package.json")))
          print(os.path.join(sys.argv[2], top, d["launch"]["program"]).replace("\\", "/"))
          PY
            )
            echo "$tool: $exe"
            upper=$(printf '%s' "$tool" | tr '[:lower:]' '[:upper:]')
            echo "PACKAGED_${upper}_BIN=$exe" >> "$GITHUB_ENV"
            # Started with no arguments, each says how it is used: it runs.
            "$exe" > "$tool.out" 2>&1 || true
            cat "$tool.out"
            grep -q "usage: $tool" "$tool.out" || { echo "::error::$tool did not run here"; exit 1; }
          done

      - name: Debug the just-unpacked Linux runner
        if: matrix.id == 'linux-x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb lldb
          work="$RUNNER_TEMP/packaged-runner-jit"
          mkdir -p "$work"
          cd "$work"
          nm --defined-only "$PACKAGED_OKRUN_BIN" > symbols.log
          grep -Eq ' [Tt] __jit_debug_register_code$' symbols.log
          grep -Eq ' [BbDd] __jit_debug_descriptor$' symbols.log
          cat > probe.c <<'C'
          __attribute__((visibility("default")))
          int ok_main(void) {
              volatile int answer = 40;
              answer += 2;
              return answer == 42 ? 0 : 2;
          }
          C
          cat > mcpp.toml <<TOML
          [package]
          name = "packaged-jit-probe"
          version = "0.1.0"
          [target.'cfg(os = "openkal")']
          platform = "openkal-platform@$PLATFORM_VERSION"
          [target.'cfg(os = "openkal")'.layers]
          c-abi = false
          "c++-abi" = false
          compiler-runtime = false
          TOML
          mcpp self env --target x86_64-openkal --format json > toolchain.json
          llvm=$(python3 -c 'import json, os; from pathlib import Path; d=json.load(open("toolchain.json"))["data"]; assert d["platform"]["version"] == os.environ["PLATFORM_VERSION"]; print(Path(d["toolchain"]["compiler"]).parent)')
          "$PACKAGED_OKLD_BIN" note-source > note.S
          "$llvm/clang" --target=x86_64-unknown-none-elf -g -O0 -fPIC -ffreestanding -fno-stack-protector -c probe.c -o probe.o
          "$llvm/clang" --target=x86_64-unknown-none-elf -fPIC -c note.S -o note.o
          "$llvm/ld.lld" -shared -e ok_main -z max-page-size=65536 -z now -z noexecstack --hash-style=both \
            --emit-relocs --compress-debug-sections=zlib -o probe.oke probe.o note.o
          "$llvm/llvm-objcopy" --remove-section='.rela.*' --remove-section='!.rela.debug_*' \
            --remove-section='!.rela.dyn' --remove-section='!.rela.plt' probe.oke
          "$PACKAGED_OKLD_BIN" note probe.oke
          "$PACKAGED_OKLD_BIN" place probe.oke
          "$PACKAGED_OKLD_BIN" check probe.oke
          cat > gdb.commands <<'GDB'
          set pagination off
          set confirm off
          set disable-randomization off
          set breakpoint pending on
          break probe.c:4
          run
          printf "packaged-before=%d\n", answer
          next
          printf "packaged-after=%d\n", answer
          continue
          GDB
          gdb --nx --quiet --batch -x gdb.commands --args "$PACKAGED_OKRUN_BIN" --debugger "$work/probe.oke" > gdb.log 2>&1
          grep -q '^packaged-before=40$' gdb.log
          grep -q '^packaged-after=42$' gdb.log
          grep -q 'exited normally' gdb.log
          cat > lldb.commands <<'LLDB'
          settings set target.disable-aslr false
          settings set plugin.jit-loader.gdb.enable on
          breakpoint set --file probe.c --line 4
          run
          frame variable answer
          thread step-over
          frame variable answer
          continue
          LLDB
          lldb --no-lldbinit --batch -s lldb.commands -- "$PACKAGED_OKRUN_BIN" --debugger "$work/probe.oke" > lldb.log 2>&1
          grep -Eq '^\(volatile int\) answer = 40$' lldb.log
          grep -Eq '^\(volatile int\) answer = 42$' lldb.log
          grep -q 'exited with status = 0' lldb.log
          echo 'packaged runner: JIT symbols and GDB/LLDB source 40 -> 42 passed'

      - name: Logs of the artificial debugger fixture
        if: always() && matrix.id == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: packaged-runner-jit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/packaged-runner-jit/gdb.log
            ${{ runner.temp }}/packaged-runner-jit/lldb.log
            ${{ runner.temp }}/packaged-runner-jit/symbols.log
          if-no-files-found: ignore

      - name: Attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" out/*
