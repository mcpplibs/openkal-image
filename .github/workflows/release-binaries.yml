name: release binaries

# okrun and okld as programs of each system and architecture, attached to a
# release: what a machine without mcpp installs to run ok images (the
# xim-pkgindex `okrun` package). Dispatched with the release's tag; each archive
# is `mcpp pack` of the tool, a static program on Linux, and carries its
# mcpp-package.json, from which `mcpp emit xpkg --package` writes the index
# entry.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag the binaries are built from and attached to (e.g. 0.1.3)"
        required: true
      platform:
        description: "The openkal-platform whose hosted arrangement builds the tools: the one whose version group holds the implementations the tag pins (0.1.5: 0.19.0; 0.1.6: 0.19.1)"
        required: true
        default: "0.19.0"
      mcpp_ref:
        description: "Branch of mcpp-community/mcpp to build with (empty = the released mcpp)"
        required: false
        default: ""

permissions:
  contents: write

env:
  MCPP_SOURCE_REF: ${{ github.event.inputs.mcpp_ref || vars.MCPP_SOURCE_REF || '' }}
  MCPP_VERSION: 2026.10.30.1
  # The platform whose hosted arrangement the programs are built over, named by
  # the dispatch beside the tag: a tag's tools pin exact implementations, and the
  # platform is the one whose version group holds them (0.1.4: 0.18.0; 0.1.5:
  # 0.19.0, openkal-linux 0.19.0; 0.1.6: 0.19.1).
  PLATFORM_VERSION: ${{ github.event.inputs.platform }}
  XLINGS_VERSION: v2026.10.26.1
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  binaries:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each system's row over openkal-platform's hosted arrangement (mcpp
          # SPEC-013 §5.4), as mcpp builds the runner it carries in a
          # self-contained package: the platform's toolchain, C library and
          # C++ run-time over the system's openkal implementation -- static on
          # Linux, no SDK on macOS, no MSVC run-time on Windows.
          - { os: ubuntu-24.04,     id: linux-x86_64,   pack: '--target x86_64-linux-musl --mode static' }
          - { os: ubuntu-24.04-arm, id: linux-aarch64,  pack: '--target aarch64-linux-musl --mode static' }
          - { os: macos-15,         id: macos-aarch64,  pack: '--target aarch64-macos' }
          - { os: windows-2022,     id: windows-x86_64, pack: '--target x86_64-windows-gnu' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Install xlings and mcpp (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install xlings and mcpp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: The mcpp that packs
        run: |
          # A branch of mcpp is built by the latest released mcpp.
          want="mcpp@$MCPP_VERSION"
          [ -n "${MCPP_SOURCE_REF:-}" ] && want=mcpp
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "$want" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          mcpp self config --mirror GLOBAL
          if [ -n "${MCPP_SOURCE_REF:-}" ]; then
            src="$RUNNER_TEMP/mcpp-src"
            git clone --quiet --depth 1 --branch "$MCPP_SOURCE_REF" https://github.com/mcpp-community/mcpp.git "$src"
            rm -f "$src/.xlings.json"
            ( cd "$src" && MCPP_JOBS=2 mcpp build --release )
            built=$(find "$src/target" -type f \( -name mcpp -o -name mcpp.exe \) -path '*/bin/*' | head -1)
            [ -n "$built" ] || { echo "::error::mcpp did not build from $MCPP_SOURCE_REF"; exit 1; }
            echo "$(cd "$(dirname "$built")" && pwd)" >> "$GITHUB_PATH"
          fi

      - name: okrun and okld, packed
        working-directory: tools
        run: |
          tag='${{ github.event.inputs.tag }}'
          mkdir -p ../out
          for tool in okrun okld; do
            mcpp pack "$tool" ${{ matrix.pack }} --platform "openkal-platform@$PLATFORM_VERSION" \
                --pkg-format zip -o "$tool-$tag-${{ matrix.id }}.zip"
            cp "target/dist/$tool-$tag-${{ matrix.id }}.zip" ../out/
          done
          ls -l ../out

      - name: Each program runs here, from its package alone
        run: |
          python=python3; [ "$RUNNER_OS" = Windows ] && python=python
          tag='${{ github.event.inputs.tag }}'
          for tool in okrun okld; do
            root="$RUNNER_TEMP/x-$tool"
            # Unpacked as an unzip program does it, each file with the mode the
            # archive states (a program that lost its x bit fails here); the
            # program is the one the package's mcpp-package.json names.
            exe=$("$python" - "out/$tool-$tag-${{ matrix.id }}.zip" "$root" <<'PY'
          import json, os, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              for info in z.infolist():
                  path = z.extract(info, sys.argv[2])
                  mode = (info.external_attr >> 16) & 0o777
                  if mode:
                      os.chmod(path, mode)
              top = os.path.commonpath([n for n in z.namelist()]).split("/")[0]
          d = json.load(open(os.path.join(sys.argv[2], top, "mcpp-package.json")))
          print(os.path.join(sys.argv[2], top, d["launch"]["program"]).replace("\\", "/"))
          PY
            )
            echo "$tool: $exe"
            # Started with no arguments, each says how it is used: it runs.
            "$exe" > "$tool.out" 2>&1 || true
            cat "$tool.out"
            grep -q "usage: $tool" "$tool.out" || { echo "::error::$tool did not run here"; exit 1; }
          done

      - name: Attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.inputs.tag }}' out/* --clobber
