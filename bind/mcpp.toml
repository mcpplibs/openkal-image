[package]
namespace   = "mcpplibs"
name        = "openkal-bind"
version     = "0.1.9"
# `mcpp::xpkg_request', `mcpp::decision' (protocol 15).
mcpp        = ">=2026.10.1.3"
description = "A build plugin: a library published as an ok image (.okso) and a C header is called from a program of any system, through a binding generated from the header and libokrun."
license     = "Apache-2.0"
authors     = ["mcpplibs"]
repo        = "https://github.com/mcpplibs/openkal-image"

# The plugin's one module, `mcpp.mcpplibs.openkal_bind' (SPEC-007 R9.6). It
# imports the engine interface, so it is compiled into the build program of
# the library that uses it and nowhere else.
[build]
sources = ["src/*.cppm"]

# The clang that reads the header, when nothing nearer names one: the
# toolchain's own when it is clang, else this payload, installed only when the
# plugin asks for it (`mcpp::xpkg_request').
[xlings.workspace]
"xim:llvm" = { version = "23.1.3", provision = "on-request" }
