[package]
namespace   = "mcpplibs"
name        = "openkal-run"
version     = "0.1.0"
description = "libokrun: the runner's core --- an ok image's names bound to this process's one openkal implementation, in the image's calling convention, and its entry entered."
license     = "Apache-2.0"
authors     = ["mcpplibs"]
repo        = "https://github.com/mcpplibs/openkal-image"

[targets.okrun]
kind = "lib"

[dependencies]
openkal = { git = "https://github.com/mcpplibs/openkal.git", branch = "openkal-0.17.0" }
openkal-ld = { path = "../ld" }

[target.linux.dependencies]
openkal-linux = { git = "https://github.com/mcpplibs/openkal-linux.git", branch = "openkal-0.17.0" }

[target.macos.dependencies]
openkal-macos = { git = "https://github.com/mcpplibs/openkal-macos.git", branch = "openkal-0.17.0" }

[target.windows.dependencies]
openkal-windows = { git = "https://github.com/mcpplibs/openkal-windows.git", branch = "openkal-0.17.0" }

# The interfaces each system's implementation provides decide one unit: where
# openkal.space is provided its names are bound, and elsewhere an image that
# requires it is refused at load, naming it.
[build]
sources = ["src/okrun.cppm", "src/run.cpp", "src/bindings.cpp"]
include_dirs = ["include"]
flags = [
  { glob = "src/*.cpp", cxxflags = ["-fno-exceptions", "-fno-rtti"] },
]

[target.linux.build]
sources = ["src/bindings_space.cpp"]

[target.macos.build]
sources = ["src/bindings_space.cpp"]

[target.windows.build]
sources = ["src/no_space.cpp"]
